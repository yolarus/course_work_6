[tool.poetry]
name = "alyautdinov-ruslan-сw-5"
version = "0.1.0"
description = ""
authors = ["Аляутдинов Руслан <rusalyautdinov@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.1.5"
djangorestframework = "^3.15.2"
psycopg2 = "^2.9.10"
pillow = "^11.1.0"
python-dotenv = "^1.0.1"
django-filter = "^24.3"
redis = "^5.2.1"
celery = "^5.4.0"
drf-yasg = "^1.21.8"
djangorestframework-simplejwt = "^5.4.0"
django-celery-beat = "^2.7.0"
coverage = "^7.6.10"
django-cors-headers = "^4.6.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
black = "^24.10.0"
mypy = "^1.14.1"
isort = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119

[tool.isort]
line_length = 119

[tool.coverage.run]
omit = ["__init__.py", "*/migrations/*", "config/*", "apps.py", "admin.py", "manage.py"]