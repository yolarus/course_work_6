version: '3.11'
services:

  habits:
    container_name: habits
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ./docker_commands.sh
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      db_habits:
        condition: service_healthy
      redis_habits:
        condition: service_started
    networks:
      - local
      - global

  db_habits:
    container_name: db_habits
    image: postgres:16.4
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 20s
      retries: 3
    networks:
      - local

  redis_habits:
    image: redis:latest
    container_name: redis_habits
    restart: on-failure
    volumes:
      - redis:/var/lib/redis/data
    expose:
      - "6379"
    ports:
      - "6379:6379"
    networks:
      - local

  celery_habits:
    container_name: celery_habits
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: on-failure
    env_file:
      - ./.env
    volumes:
      - .:/code
    command: bash -c "celery -A config worker -l INFO -S django"
    depends_on:
      - habits
    networks:
      - local
      - global

  celery_beat_habits:
    container_name: celery_beat_habits
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: on-failure
    env_file:
      - ./.env
    volumes:
      - .:/code
    command: bash -c "celery -A config beat -l info -S django"
    depends_on:
      - habits
    networks:
      - local

  nginx_habits:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/code/staticfiles
    depends_on:
      - celery_habits
      - celery_beat_habits
    networks:
      - local
      - global

volumes:
  habits:
    driver: local
  db_habits:
    driver: local
  static_volume:
    driver: local
  redis:

networks:
  local:
    driver: bridge
    internal: true
  global:
    driver: bridge
    internal: false